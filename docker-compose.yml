services:
  api:
    build: .
    container_name: api
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-labs-devstral-small-2512}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.mistral.ai/v1}
      - NF_AGENT_PLUGIN=${NF_AGENT_PLUGIN:-izs}
      - VECTOR_DB_TYPE=${VECTOR_DB_TYPE:-faiss}
    volumes:
      - ../cohesive-ngsmanager-cli:/cohesive-ngsmanager-cli
      - ./plugins:/app/plugins
      - hf_cache:/tmp/huggingface

  # The HTTPS Server
  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
  hf_cache:
