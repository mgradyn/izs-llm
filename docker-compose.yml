services:
  api:
    build: .
    container_name: api
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ../cohesive-ngsmanager-cli:/cohesive-ngsmanager-cli
      - ./data:/app/data
      - ./plugins:/app/plugins
      - hf_cache:/tmp/huggingface

  # The HTTPS Server
  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
  hf_cache:
