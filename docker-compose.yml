services:
  api:
    build: .
    container_name: api_test
    restart: always
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - NGSMANAGER_DIR=/app/ngsmanager
    volumes:
      - ./fake_folder:/app/ngsmanager

  caddy:
    image: caddy:latest
    container_name: caddy_test
    restart: always
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data_test:/data
      - caddy_config_test:/config
    depends_on:
      - api

volumes:
  caddy_data_test:
  caddy_config_test:
